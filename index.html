function parseFollowUpDays(text) {
  const t = text.split('—')[0].trim().toLowerCase();
  const m = t.match(/(\d+(?:\.\d+)?)\s*(day|week|month|year|יום|שבוע|שבועות|חודש|שנה)/);
  if (!m) return null;
  const n = parseFloat(m[1]);
  if (t.includes('day') || t.includes('ימ'))   return n;
  if (t.includes('week')|| t.includes('שבו'))  return n * 7;
  if (t.includes('month')|| t.includes('חודש')) return n * 30;
  if (t.includes('year')|| t.includes('שנ'))  return n * 365;
  return null;
}

function buildICS(injuryLabel, followUpSchedule) {
  const now = new Date();
  const stamp = now.toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';
  const events = followUpSchedule.map((fu, i) => {
    const days = parseFollowUpDays(fu);
    if (!days) return '';
    const d = new Date(now);
    d.setDate(d.getDate() + Math.round(days));
    const dateStr = d.toISOString().split('T')[0].replace(/-/g,'');
    const uid = `dentosafe-${now.getTime()}-${i}@app`;
    const desc = fu.replace(/,/g,'\\,').replace(/\n/g,'\\n');
    return ['BEGIN:VEVENT',`UID:${uid}`,`DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${dateStr}`,`DTEND;VALUE=DATE:${dateStr}`,
      `SUMMARY:DentoSafe – ${injuryLabel} (מעקב)`,`DESCRIPTION:${desc}`,
      'END:VEVENT'].join('\r\n');
  }).filter(Boolean).join('\r\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DentoSafe//IADT2020//HE',
    events,'END:VCALENDAR'].join('\r\n');
}

function downloadICS(content, filename) {
  const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function AvulsionTimer() {
  const [elapsed, setElapsed] = React.useState(0);
  const start = React.useRef(Date.now());

  React.useEffect(() => {
    const id = setInterval(() => setElapsed(Math.floor((Date.now() - start.current) / 1000)), 1000);
    return () => clearInterval(id);
  }, []);

  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;
  const isDanger  = mins >= 60;
  const isWarning = mins >= 30 && !isDanger;

  const colors = isDanger  ? 'bg-red-50 border-red-400 text-red-800' :
                 isWarning ? 'bg-amber-50 border-amber-400 text-amber-800' :
                             'bg-green-50 border-green-400 text-green-800';
  const msg = isDanger  ? '⚠ חלפו 60 דקות — סיכוי נמוך להציל תאי שורש.' :
              isWarning ? '⚠ מתקרב לחלון ה-60 דקות — פעלו מהר!' :
                          '✓ עדיין בחלון זמן הזהב של 60 הדקות הראשונות.';

  return (
    <div className={`rounded-xl border-2 p-4 mb-4 ${colors}`}>
      <div className="text-xs font-bold uppercase tracking-wider mb-1">⏱ זמן מאז הכניסה לאפליקציה</div>
      <div className="text-4xl font-bold font-mono tracking-widest text-left" dir="ltr">
        {String(mins).padStart(2,'0')}:{String(secs).padStart(2,'0')}
      </div>
      <p className="text-sm mt-1 font-medium">{msg}</p>
    </div>
  );
}

          <div className="pr-2">
            <div className="flex items-center gap-2 mb-1 flex-wrap"><h2 className="text-xl font-bold text-medical-900">{injury.label}</h2><SeverityBadge severity={injury.severity} /></div>
            <p className="text-sm text-medical-600">{injury.description}</p>
          </div>
        </div>
      </div>

      <div className="flex border-b border-medical-100 bg-medical-50 px-4 no-print text-sm">
        {[{id:'treatment',l:'טיפול וקליניקה'},{id:'splinting',l:'קיבוע'},{id:'followup',l:'מעקבים ואנליזה'}].map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} className={`px-4 py-3 font-semibold border-b-2 transition-colors ${tab === t.id ? 'border-medical-500 text-medical-700' : 'border-transparent text-medical-400 hover:text-medical-600'}`}>{t.l}</button>
        ))}
      </div>

      <div className="p-5">
        {tab === 'treatment' && (
          <div className="fade-in">
            <h3 className="text-xs font-semibold text-medical-700 mb-3 uppercase tracking-wider">פרוטוקול ופעולות</h3>
            <ol className="space-y-2">
              {(injury.immediateActions || []).map((action, i) => (
                <li key={i} className="flex gap-3 text-sm text-medical-800"><span className="flex-shrink-0 w-6 h-6 rounded-full bg-medical-600 text-white text-xs flex items-center justify-center font-bold pointer-events-none">{i+1}</span><span className="pt-0.5 leading-relaxed">{action}</span></li>
              ))}
            </ol>
            {isAvulsion && (
              <div className="mt-6">
                <h3 className="text-xs font-semibold text-medical-700 mb-3 tracking-wider">זמני ניתוק אקסטרה-אורלים והשלכות פרוטוקול:</h3>
                <div className="grid gap-3">
                  {Object.values(injury.extraoralTime).map((scenario, i) => (
                    <div key={i} className="rounded-xl border border-medical-200 p-4 bg-gray-50"><div className="font-bold text-medical-800 text-sm mb-2">{scenario.label}</div><ul className="space-y-1">{scenario.protocol.map((step, j) => (<li key={j} className="text-xs text-medical-600 flex gap-2"><span className="text-medical-400">•</span>{step}</li>))}</ul></div>
                  ))}
                </div>
              </div>
            )}
             {injury.prognosis && (<div className="mt-5 p-4 rounded-xl bg-medical-50 border border-medical-100"><div className="text-xs font-semibold text-medical-600 mb-1 tracking-wider">הערכת פרוגנוזה</div><p className="text-sm text-medical-800">{injury.prognosis}</p></div>)}
          </div>
        )}

        {tab === 'splinting' && (
          <div className="fade-in">
            <h3 className="text-xs font-semibold text-medical-700 mb-3 tracking-wider">זמני קיבועים למקרה זה</h3>
            <div className="p-4 rounded-xl bg-medical-50 border border-medical-200 text-sm text-medical-800">{injury.splinting}</div>
          </div>
        )}

        {tab === 'followup' && (
          <div className="fade-in">
            <div className="flex items-center justify-between mb-3">
              <h3 className="text-xs font-semibold text-medical-700 tracking-wider">יומן מעקבים למרפאה</h3>
              <button onClick={handleICS} className="no-print text-xs bg-medical-600 text-white px-3 py-1.5 rounded-lg hover:bg-medical-700 font-medium">📅 יצוא קובץ יומן</button>
            </div>
            <div className="space-y-2">
              {(injury.followUp || []).map((fu, i) => (
                <div key={i} className="flex items-start gap-2.5 px-3 py-2 rounded-lg bg-medical-50 border border-medical-100"><span className="w-5 h-5 rounded-full bg-medical-500 text-white text-xs flex items-center justify-center font-bold flex-shrink-0 mt-0.5">{i+1}</span><span className="text-xs text-medical-700 leading-relaxed">{fu}</span></div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [userMode, setUserMode] = React.useState(null);
  const [toothType, setToothType] = React.useState(null);
  const [selectedInjury, setSelectedInjury] = React.useState(null);

  const handleQuickAvulsion = () => { setToothType('permanent'); setSelectedInjury('avulsion'); };
  const handleResetMode = () => { setUserMode(null); setToothType(null); setSelectedInjury(null); };

  const injuries = toothType ? clinicalData[toothType] : {};
  const isParent = userMode === 'parent';

  if (!userMode) return <ModeSelectScreen onSelect={setUserMode} />;

  return (
    <div className="min-h-screen flex flex-col">
      <EmergencyBanner onQuickAvulsion={handleQuickAvulsion} mode={userMode} />
      <Header mode={userMode} onResetMode={handleResetMode} />

      <main className="flex-1 max-w-3xl mx-auto w-full px-4 py-6 space-y-6">
        {!selectedInjury && (
          <section>
            <div className="flex items-center gap-2 mb-3 no-print"><span className="w-6 h-6 rounded-full bg-medical-600 text-white text-xs flex items-center justify-center font-bold">1</span><h2 className="font-semibold text-medical-800">בחר סוג רבדים (משנן)</h2></div>
            <div className="grid grid-cols-2 gap-3">
              <ToothTypeCard type="permanent" label="שיניים קבועות" subtitle="משנן בוגר (גיל 6+)" icon="🦷" selected={toothType === 'permanent'} onClick={() => { setToothType('permanent'); setSelectedInjury(null); }} />
              <ToothTypeCard type="primary" label="שיניים נשירות (חלב)" subtitle="משנן ילדים (0-6)" icon="🐣" selected={toothType === 'primary'} onClick={() => { setToothType('primary'); setSelectedInjury(null); }} />
            </div>
          </section>
        )}

        {toothType && !selectedInjury && (
          <section className="fade-in">
            <div className="flex items-center gap-2 mb-3 no-print"><span className="w-6 h-6 rounded-full bg-medical-600 text-white text-xs flex items-center justify-center font-bold">2</span><h2 className="font-semibold text-medical-800">בחר המקרה הדנטלי שעברת:</h2></div>
            <div className="space-y-2">
              {Object.entries(injuries).map(([key, injury]) => (
                <InjuryCard key={key} injury={injury} injuryKey={key} onClick={() => setSelectedInjury(key)} />
              ))}
            </div>
          </section>
        )}

        {toothType && selectedInjury && (
          <section className="fade-in">
            <div className="flex items-center gap-2 mb-3 no-print"><span className="w-6 h-6 rounded-full bg-medical-600 text-white text-xs flex items-center justify-center font-bold">3</span><h2 className="font-semibold text-medical-800">{isParent ? 'הנחיות - מה לעשות' : 'פרוטוקול עבודה'}</h2></div>
            {isParent ? <ParentProtocolPanel injury={injuries[selectedInjury]} injuryKey={selectedInjury} onBack={() => setSelectedInjury(null)} /> : <ProtocolPanel injury={injuries[selectedInjury]} injuryKey={selectedInjury} toothType={toothType} onBack={() => setSelectedInjury(null)} />}
          </section>
        )}

        {!toothType && (
            <div className="text-center py-12 text-medical-400">
                <div className="text-5xl mb-4">🦷</div>
                <p className="text-sm">אנא השלם את השלבים שלמעלה ולחץ על הבחירה המועדפת כדי להמשיך להנחיות.</p>
            </div>
        )}
      </main>

      <footer className="text-center py-4 text-xs text-medical-300 border-t border-medical-100 bg-white no-print">
        DentoSafe · תרגום לעברית · לשימוש רפואי ולשגיאת הצוות הרפואי.
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
