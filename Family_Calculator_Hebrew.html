<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מחשבון כלכלי למשפחה</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #f0fdf4 0%, #fefce8 45%, #eff6ff 100%);
      background-attachment: fixed;
      color: #1a2b3c;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }
    .page { max-width: 1120px; margin: 0 auto; padding: 16px 12px 64px; }
    @media (min-width: 600px) { .page { padding: 24px 20px 72px; } }
    @media (min-width: 900px) { .page { padding: 32px 28px 80px; } }

    .hero-card {
      background: linear-gradient(135deg, #064e3b 0%, #065f46 45%, #0f766e 100%);
      border-radius: 22px; padding: 20px 22px;
      margin-bottom: 16px; color: white;
      box-shadow: 0 10px 40px rgba(6,78,59,0.4);
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      position: relative; overflow: hidden;
    }
    .hero-logo { width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; border: 1.5px solid rgba(255,255,255,0.2); }
    .hero-text { flex: 1; min-width: 160px; }
    .family-name-input {
      font-size: clamp(1.1rem, 4vw, 1.55rem); font-weight: 800; color: #fff;
      border: none; background: transparent; outline: none; width: 100%;
      border-bottom: 2px dashed rgba(255,255,255,0.3); padding: 1px 0;
    }
    .hero-sub { font-size: 0.8rem; color: rgba(255,255,255,0.65); margin-top: 3px; }
    .hero-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; z-index:1; }

    .month-nav { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 5px 10px; }
    .month-btn { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.85); font-size: 1.1rem; font-weight: 700; padding: 0 3px; }
    .month-label { font-size: 0.8rem; font-weight: 700; color: #fff; white-space: nowrap; min-width: 86px; text-align: center; }

    .currency-toggle { display: flex; gap: 4px; background: rgba(255,255,255,0.12); border-radius: 8px; padding: 3px; }
    .cur-btn { padding: 5px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: 800; border: none; background: transparent; color: rgba(255,255,255,0.7); cursor: pointer; }
    .cur-btn.active { background: #fff; color: #064e3b; }

    .btn-icon { display: flex; align-items: justify; width: 36px; height: 36px; border-radius: 9px; border: 1.5px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.12); color: #fff; cursor: pointer; justify-content: center;}
    
    .section-gap { margin-top: 14px; }
    .card { border-radius: 20px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08); border: 1px solid rgba(255,255,255,0.7); }
    .section-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; cursor: pointer; user-select: none; }
    .section-header-left { display: flex; align-items: center; gap: 12px; }
    .section-header-title { font-size: 0.88rem; font-weight: 800; color: #fff; text-transform: uppercase; }
    .section-header-badge { background: rgba(255,255,255,0.22); color: #fff; font-size: 1rem; font-weight: 800; padding: 4px 14px; border-radius: 999px; }
    .section-header-right { display: flex; align-items: center; gap: 10px; }

    .grad-income { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
    .grad-fixed { background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%); }
    .grad-variable { background: linear-gradient(135deg, #c2410c 0%, #f97316 100%); }
    .grad-savings { background: linear-gradient(135deg, #6d28d9 0%, #8b5cf6 100%); }
    .grad-investment { background: linear-gradient(135deg, #be185d 0%, #ec4899 100%); }
    .grad-summary { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); }

    .section-body { background: #fff; padding: 18px 16px; }

    .field-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 12px; gap: 12px; }
    .field-left { display: flex; align-items: center; gap: 10px; flex: 1; }
    .field-icon-wrap { width: 34px; height: 34px; border-radius: 9px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .field-label { font-size: 0.86rem; font-weight: 500; color: #374151; }
    .field-input { background: #f8fafc; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 1rem; font-weight: 700; width: 120px; padding: 7px 12px; outline: none; text-align: left;}

    .partner-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px; gap: 12px; border-bottom: 1px solid #f3f4f6; }
    .partner-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .partner-avatar { width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
    .avatar-1 { background: linear-gradient(135deg, #a7f3d0, #6ee7b7); }
    .avatar-2 { background: linear-gradient(135deg, #bfdbfe, #93c5fd); }
    .partner-name-input { border: none; border-bottom: 2px dashed #e5e7eb; background: transparent; font-size: 0.95rem; font-weight: 700; outline: none; }

    .extra-income-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
    .extra-label-input { border: none; border-bottom: 1.5px dashed #e5e7eb; background: transparent; font-size: 0.84rem; outline: none; flex: 1; }
    .btn-remove { background: none; border: none; color: #ef4444; font-size: 1rem; cursor: pointer; }
    .btn-add-row { background: #ecfdf5; border: 2px dashed #6ee7b7; border-radius: 10px; padding: 9px 14px; color: #059669; font-size: 0.82rem; font-weight: 700; cursor: pointer; width: 100%; margin-top: 12px; }

    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 0; }
    .grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 860px) { .grid-2 { grid-template-columns: 1fr 1fr; gap: 28px; } }
    @media (min-width: 560px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }

    .col-divider { border-left: 1px solid #f3f4f6; padding-left: 20px; }
    @media (max-width: 859px) { .col-divider { border-left: none; padding-left: 0; border-bottom: 1px solid #f3f4f6; padding-bottom: 12px; margin-bottom: 12px; } }
    
    .kpi-card { border-radius: 16px; padding: 16px 14px; text-align: center; color: white; }
    .kpi-card.green { background: linear-gradient(135deg,#059669,#047857); }
    .kpi-card.orange { background: linear-gradient(135deg,#ea580c,#c2410c); }
    .kpi-card.purple { background: linear-gradient(135deg,#7c3aed,#6d28d9); }
    .kpi-card.pink { background: linear-gradient(135deg,#db2777,#be185d); }
    .kpi-card.dark { background: linear-gradient(135deg,#1e293b,#0f172a); }
    .kpi-card.blue { background: linear-gradient(135deg,#2563eb,#1d4ed8); }
    .kpi-value { font-size: clamp(1.1rem, 4vw, 1.7rem); font-weight: 900; }
    .kpi-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; margin-top: 5px; opacity: 0.85; }

    .balance-hero { border-radius: 20px; padding: 32px 24px; text-align: center; margin-bottom: 20px; color: white; }
    .balance-hero.positive { background: linear-gradient(135deg, #047857 0%, #059669 50%, #10b981 100%); }
    .balance-hero.negative { background: linear-gradient(135deg, #991b1b 0%, #dc2626 50%, #ef4444 100%); }
    .balance-value { font-size: 3.5rem; font-weight: 900; }
    
    .alloc-bar { height: 26px; border-radius: 13px; display: flex; gap: 4px; background: #f1f5f9; padding: 3px; }
    .alloc-seg { height: 100%; border-radius: 9px; }
    
    .insight-item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; border-right: 4px solid #e5e7eb; border-radius: 12px; }
    .insight-item.good { border-right-color: #10b981; background: #f0fdf4; }
    .insight-item.warn { border-right-color: #f59e0b; background: #fffbeb; }
    .insight-item.danger { border-right-color: #ef4444; background: #fef2f2; }
    .insight-text { font-size: 0.85rem; }

    .mini-stat { background: #f8fafc; border-radius: 12px; padding: 10px; border: 1px solid #e5e7eb; }
    .mini-stat-label { font-size: 0.63rem; color: #9ca3af; font-weight: 700; }
    .mini-stat-value { font-size: 1.1rem; font-weight: 900; }

    .savings-rate-bar { margin-top: 14px; background: #f1f5f9; border-radius: 10px; padding: 10px 14px; }
    .savings-rate-track { height: 10px; background: #e5e7eb; border-radius: 5px; }
    .savings-rate-fill { height: 100%; border-radius: 5px; }
    
    .footnote { font-size: 0.68rem; color: #9ca3af; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;
const USD_TO_NIS = 3.70;
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const STORAGE_KEY = 'family-calc-he-v1';
const uid = () => Math.random().toString(36).slice(2);
const sumObj = (obj) => Object.values(obj).reduce((s, v) => s + (Number(v) || 0), 0);
const sumArr = (arr) => arr.reduce((s, r) => s + (Number(r.amount) || 0), 0);

function Ring({ score, size = 140, stroke = 14 }) {
  const color = score >= 70 ? '#10b981' : score >= 40 ? '#f59e0b' : '#ef4444';
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const fill = circ * (score / 100);
  return (
    <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#f1f5f9" strokeWidth={stroke} />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={`${fill} ${circ - fill}`} />
    </svg>
  );
}

function SectionCard({ title, badge, grad, collapsed, onToggle, children }) {
  return (
    <div className="card section-gap">
      <div className={`section-header ${grad}`} onClick={onToggle}>
        <div className="section-header-left">
          <span className="section-header-title">{title}</span>
        </div>
        <div className="section-header-right">
          {badge !== undefined && <span className="section-header-badge">{badge}</span>}
          <span className="section-collapse-icon no-print">{collapsed ? '▶' : '▼'}</span>
        </div>
      </div>
      {!collapsed && <div className="section-body">{children}</div>}
    </div>
  );
}

function FieldRow({ icon, label, value, onChange, accentColor = '#059669' }) {
  return (
    <div className="field-row">
      <div className="field-left">
        <div className="field-icon-wrap">{icon}</div>
        <span className="field-label">{label}</span>
      </div>
      <input className="field-input" type="number" min="0" placeholder="0" value={value || ''} onChange={e => onChange(parseFloat(e.target.value) || 0)} />
    </div>
  );
}

function App() {
  const now = new Date();
  const [familyName, setFamilyName] = useState('המשפחה שלנו');
  const [currency, setCurrency] = useState('NIS');
  const [month, setMonth] = useState(now.getMonth());
  const [year, setYear] = useState(now.getFullYear());
  const [collapsed, setCollapsed] = useState({});
  const [hydrated, setHydrated] = useState(false);

  const [p1Name, setP1Name] = useState('צד א\'');
  const [p1Salary, setP1Salary] = useState(0);
  const [p2Name, setP2Name] = useState('צד ב\'');
  const [p2Salary, setP2Salary] = useState(0);
  const [extras, setExtras] = useState([{ id: uid(), label: 'הכנסה נוספת / פרילנס', amount: 0 }]);

  const [fixed, setFixed] = useState({ rent:0, carLoan:0, phone:0, insurance:0, education:0, subscriptions:0, loanRepayment:0, other:0 });
  const [variable, setVariable] = useState({ groceries:0, utilities:0, transport:0, dining:0, clothing:0, healthcare:0, children:0, leisure:0, other:0 });
  const [savings, setSavings] = useState({ pension:0, emergency:0, shortTerm:0, other:0 });
  const [investments, setInvestments] = useState({ stocks:0, realEstate:0, other:0 });

  const rate = currency === 'USD' ? (1/USD_TO_NIS) : 1;
  const sym  = currency === 'NIS' ? '₪' : '$';
  const fmtM = (v) => `${sym}${Math.round((v || 0) * rate).toLocaleString()}`;

  useEffect(() => { setHydrated(true); }, []);

  const totalIncome = p1Salary + p2Salary + sumArr(extras);
  const totalFixed = sumObj(fixed);
  const totalVariable = sumObj(variable);
  const totalSavings = sumObj(savings);
  const totalInvestments = sumObj(investments);
  const totalExpenses = totalFixed + totalVariable;
  const totalOutflows = totalExpenses + totalSavings + totalInvestments;
  const netBalance = totalIncome - totalOutflows;

  const monthsRunway = totalExpenses > 0 ? (savings.emergency / totalExpenses).toFixed(1) : "0.0";
  const tenYearProjection = netBalance > 0 ? netBalance * ((Math.pow(1.00583, 120) - 1) / 0.00583) : 0;
  const housingPct = totalIncome > 0 ? (fixed.rent / totalIncome) * 100 : 0;
  const savingsRate = totalIncome > 0 ? (totalSavings / totalIncome) * 100 : 0;
  const monthsEmerg = totalExpenses > 0 ? savings.emergency / (totalExpenses / 12) : 0;

  const healthScore = Math.max(0, Math.min(100, 40 + (netBalance >= 0 ? 20 : 0) + (savingsRate >= 20 ? 15 : savingsRate >= 10 ? 8 : 0) + (housingPct <= 30 ? 10 : housingPct > 50 ? -15 : 0) + (monthsEmerg >= 3 ? 10 : monthsEmerg >= 1 ? 4 : 0) + (totalInvestments > 0 ? 5 : 0) + (tenYearProjection > 500000 ? 5 : 0)));
  const scoreLabel = healthScore >= 70 ? '🌟 מצוין' : healthScore >= 40 ? '📊 דורש עבודה' : '⚠️ בסיכון';
  const scoreColor = healthScore >= 70 ? '#10b981' : healthScore >= 40 ? '#f59e0b' : '#ef4444';

  const prevMonth = () => { if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); };
  const nextMonth = () => { if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); };
  const allocSegs = [
    { label:'कבועות', pct: (totalFixed/totalIncome)*100||0, color:'#3b82f6' },
    { label:'אשראי', pct: (totalVariable/totalIncome)*100||0, color:'#f97316' },
    { label:'חסכונות', pct: (totalSavings/totalIncome)*100||0, color:'#8b5cf6' },
    { label:'השקעות', pct: (totalInvestments/totalIncome)*100||0, color:'#ec4899' },
    { label:'עודף', pct: (Math.max(0,netBalance)/totalIncome)*100||0, color:'#10b981' }
  ].filter(s => s.pct > 0.5);

  const insights = [];
  if (totalIncome === 0) insights.push({ type:'warn', icon:'💡', text: 'הזן את הכנסותיך למעלה כדי להתחיל לראות תובנות מותאמות אישית.' });
  else if (netBalance < 0) insights.push({ type:'danger', icon:'🚨', text: <><strong>אתה מוציא {fmtM(Math.abs(netBalance))} יותר ממה שאתה מכניס</strong> החודש. עיין בהוצאות האשראי או הגדל הכנסות.</> });
  else if (netBalance > 0) insights.push({ type:'good', icon:'✅', text: <><strong>יש לך עודף חודשי של {fmtM(netBalance)}.</strong> שקול להעביר זאת לחסכונות או השקעות.</> });
  
  if (housingPct > 50) insights.push({ type:'danger', icon:'🏠', text: <>תקציב הדיור לוקח <strong>{housingPct.toFixed(0)}%</strong> מההכנסה — המומחים ממליצים להישאר מתחת ל-30%.</> });
  else if (housingPct > 30) insights.push({ type:'warn', icon:'🏠', text: <>תקציב הדיור הוא <strong>{housingPct.toFixed(0)}%</strong>. השתדלו להוריד אותו מתחת ל-30%.</> });
  
  if (savingsRate >= 20) insights.push({ type:'good', icon:'💰', text: <>שיעור החיסכון הוא <strong>{savingsRate.toFixed(0)}%</strong> — מצוין! אתם בדרך הנכונה לעצמאות כלכלית.</> });
  else if (savingsRate >= 10) insights.push({ type:'warn', icon:'💰', text: <>שיעור החיסכון הוא <strong>{savingsRate.toFixed(0)}%</strong>. נסו לשאוף ל-20% לביטחון ארוך טווח.</> });
  else if (totalSavings > 0) insights.push({ type:'danger', icon:'💰', text: <>שיעור חיסכון נמוך: <strong>{savingsRate.toFixed(0)}%</strong>. המטרה היא לפחות 10-20%.</> });

  return (
    <div className="page">
      <div className="hero-card">
        <div className="hero-logo">🏠</div>
        <div className="hero-text">
          <input className="family-name-input" value={familyName} onChange={e=>setFamilyName(e.target.value)} placeholder="שם המשפחה" />
          <div className="hero-sub">תקציב חודשי ומעקב פיננסי</div>
        </div>
        <div className="hero-actions">
          <div className="month-nav">
            <button className="month-btn" onClick={nextMonth}>›</button>
            <span className="month-label">{MONTHS[month]} {year}</span>
            <button className="month-btn" onClick={prevMonth}>‹</button>
          </div>
          <div className="currency-toggle">
            <button className={`cur-btn ${currency==='NIS'?'active':''}`} onClick={()=>setCurrency('NIS')}>₪ NIS</button>
            <button className={`cur-btn ${currency==='USD'?'active':''}`} onClick={()=>setCurrency('USD')}>$ USD</button>
          </div>
        </div>
      </div>

      <SectionCard title="💚 הכנסות" grad="grad-income" badge={fmtM(totalIncome)} collapsed={collapsed.income} onToggle={()=>setCollapsed({...collapsed, income:!collapsed.income})}>
        <div className="partner-row">
          <div className="partner-left"><div className="partner-avatar avatar-1">👨</div><input className="partner-name-input" value={p1Name} onChange={e=>setP1Name(e.target.value)} placeholder="צד א'" /></div>
          <input className="field-input" type="number" min="0" value={p1Salary||''} onChange={e=>setP1Salary(parseFloat(e.target.value)||0)} />
        </div>
        <div className="partner-row">
          <div className="partner-left"><div className="partner-avatar avatar-2">👩</div><input className="partner-name-input" value={p2Name} onChange={e=>setP2Name(e.target.value)} placeholder="צד ב'" /></div>
          <input className="field-input" type="number" min="0" value={p2Salary||''} onChange={e=>setP2Salary(parseFloat(e.target.value)||0)} />
        </div>
        {extras.map(row => (
          <div className="extra-income-row" key={row.id}>
            <div className="field-icon-wrap">➕</div>
            <input className="extra-label-input" value={row.label} onChange={e=>setExtras(extras.map(r=>r.id===row.id?{...r,label:e.target.value}:r))} placeholder="מקור הכנסה" />
            <input className="field-input" type="number" min="0" value={row.amount||''} onChange={e=>setExtras(extras.map(r=>r.id===row.id?{...r,amount:parseFloat(e.target.value)||0}:r))} />
            <button className="btn-remove" onClick={()=>setExtras(extras.filter(r=>r.id!==row.id))}>✕</button>
          </div>
        ))}
        <button className="btn-add-row" onClick={() => setExtras([...extras, { id:uid(), label:'הכנסה אחרת', amount:0 }])}>＋ הוסף מקור הכנסה</button>
      </SectionCard>

      <SectionCard title="🔵 הוצאות קבועות" grad="grad-fixed" badge={fmtM(totalFixed)} collapsed={collapsed.fixed} onToggle={()=>setCollapsed({...collapsed, fixed:!collapsed.fixed})}>
        <div className="grid-2">
          <div className="col-divider">
            <FieldRow icon="🏠" label="משכנתא / שכירות" value={fixed.rent} onChange={v=>setFixed({...fixed, rent:v})} />
            <FieldRow icon="🚗" label="הלוואת רכב / ליסינג" value={fixed.carLoan} onChange={v=>setFixed({...fixed, carLoan:v})} />
            <FieldRow icon="📱" label="חשבונות טלפון וסלולר" value={fixed.phone} onChange={v=>setFixed({...fixed, phone:v})} />
            <FieldRow icon="🛡️" label="ביטוחים (בריאות, רכב, חיים)" value={fixed.insurance} onChange={v=>setFixed({...fixed, insurance:v})} />
          </div>
          <div>
            <FieldRow icon="🎓" label="חינוך / שכר לימוד" value={fixed.education} onChange={v=>setFixed({...fixed, education:v})} />
            <FieldRow icon="📺" label="מנויים (נטפליקס, ספוטיפיי...)" value={fixed.subscriptions} onChange={v=>setFixed({...fixed, subscriptions:v})} />
            <FieldRow icon="🏦" label="החזרי הלוואות" value={fixed.loanRepayment} onChange={v=>setFixed({...fixed, loanRepayment:v})} />
            <FieldRow icon="📌" label="הוצאות קבועות אחרות" value={fixed.other} onChange={v=>setFixed({...fixed, other:v})} />
          </div>
        </div>
      </SectionCard>

      <SectionCard title="💳 הוצאות אשראי רגילות" grad="grad-variable" badge={fmtM(totalVariable)} collapsed={collapsed.variable} onToggle={()=>setCollapsed({...collapsed, variable:!collapsed.variable})}>
        <div className="grid-2">
          <div className="col-divider">
            <FieldRow icon="🛒" label="קניות מזון וסופרמרקט" value={variable.groceries} onChange={v=>setVariable({...variable, groceries:v})} />
            <FieldRow icon="⚡" label="חשבונות (חשמל, מים, גז)" value={variable.utilities} onChange={v=>setVariable({...variable, utilities:v})} />
            <FieldRow icon="⛽" label="תחבורה ודלק" value={variable.transport} onChange={v=>setVariable({...variable, transport:v})} />
            <FieldRow icon="🍽️" label="מסעדות וטייק-אווי" value={variable.dining} onChange={v=>setVariable({...variable, dining:v})} />
            <FieldRow icon="👗" label="ביגוד וטיפוח אישי" value={variable.clothing} onChange={v=>setVariable({...variable, clothing:v})} />
          </div>
          <div>
            <FieldRow icon="🏥" label="בריאות ותרופות" value={variable.healthcare} onChange={v=>setVariable({...variable, healthcare:v})} />
            <FieldRow icon="👶" label="ילדים (חוגים, פעילויות)" value={variable.children} onChange={v=>setVariable({...variable, children:v})} />
            <FieldRow icon="🎉" label="פנאי, חופשות ותחביבים" value={variable.leisure} onChange={v=>setVariable({...variable, leisure:v})} />
            <FieldRow icon="📦" label="הוצאות משתנות אחרות" value={variable.other} onChange={v=>setVariable({...variable, other:v})} />
          </div>
        </div>
      </SectionCard>

      <SectionCard title="💜 חסכונות" grad="grad-savings" badge={fmtM(totalSavings)} collapsed={collapsed.savings} onToggle={()=>setCollapsed({...collapsed, savings:!collapsed.savings})}>
        <FieldRow icon="🏦" label="פנסיה / קופת גמל" value={savings.pension} onChange={v=>setSavings({...savings, pension:v})} />
        <FieldRow icon="🛡️" label="קרן חירום" value={savings.emergency} onChange={v=>setSavings({...savings, emergency:v})} />
        <FieldRow icon="🎯" label="יעדים קצרי טווח (חופשה, רכב)" value={savings.shortTerm} onChange={v=>setSavings({...savings, shortTerm:v})} />
        <FieldRow icon="💾" label="חסכונות אחרים" value={savings.other} onChange={v=>setSavings({...savings, other:v})} />
      </SectionCard>

      <SectionCard title="💗 השקעות" grad="grad-investment" badge={fmtM(totalInvestments)} collapsed={collapsed.investments} onToggle={()=>setCollapsed({...collapsed, investments:!collapsed.investments})}>
        <FieldRow icon="📈" label="מניות וקרנות סל" value={investments.stocks} onChange={v=>setInvestments({...investments, stocks:v})} />
        <FieldRow icon="🏘️" label="נדל''ן" value={investments.realEstate} onChange={v=>setInvestments({...investments, realEstate:v})} />
        <FieldRow icon="💎" label="קריפטו / השקעות אחרות" value={investments.other} onChange={v=>setInvestments({...investments, other:v})} />
      </SectionCard>

      <SectionCard title="📊 סיכום חודשי" grad="grad-summary" collapsed={collapsed.summary} onToggle={()=>setCollapsed({...collapsed, summary:!collapsed.summary})}>
        <div className={`balance-hero ${netBalance >= 0 ? 'positive' : 'negative'}`}>
          <div style={{fontSize:'0.85rem', fontWeight:'bold'}}>{netBalance >= 0 ? '✨ עודף חודשי' : '⚠️ גירעון חודשי'}</div>
          <div className="balance-value">{fmtM(Math.abs(netBalance))}</div>
          <div style={{fontSize:'0.9rem'}}>{fmtM(totalIncome)} הוכנסו &nbsp;–&nbsp; {fmtM(totalOutflows)} הוצאו ונחסכו</div>
        </div>

        {totalIncome > 0 && (
          <div style={{marginBottom:'20px'}}>
            <div style={{fontSize:'0.9rem', fontWeight:'bold', marginBottom:'10px'}}>חלוקת התקציב שלך</div>
            <div className="alloc-bar">
              {allocSegs.map(s => <div key={s.label} className="alloc-seg" style={{width:`${s.pct}%`, background:s.color}} />)}
            </div>
          </div>
        )}

        <div className="grid-4" style={{marginBottom:'20px'}}>
          <div className="kpi-card green"><div className="kpi-value">{fmtM(totalIncome)}</div><div className="kpi-label">הכנסות</div></div>
          <div className="kpi-card orange"><div className="kpi-value">{fmtM(totalExpenses)}</div><div className="kpi-label">הוצאות</div></div>
          <div className="kpi-card purple"><div className="kpi-value">{fmtM(totalSavings)}</div><div className="kpi-label">חסכונות</div></div>
          <div className="kpi-card pink"><div className="kpi-value">{fmtM(totalInvestments)}</div><div className="kpi-label">השקעות</div></div>
        </div>

         <div style={{display:'flex', gap:'20px'}}>
            <div className="mini-stat" style={{flex:1}}><div className="mini-stat-label">שיעור חיסכון</div><div className="mini-stat-value">{savingsRate.toFixed(1)}%</div></div>
            <div className="mini-stat" style={{flex:1}}><div className="mini-stat-label">קרן חירום</div><div className="mini-stat-value">{monthsEmerg.toFixed(1)} חודשים</div></div>
         </div>
      </SectionCard>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
